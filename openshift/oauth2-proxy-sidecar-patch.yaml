spec:
  template:
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2
          imagePullPolicy: IfNotPresent
          args: []
          env:
            - name: ENTRA_APPLICATION_ID
              valueFrom:
                secretKeyRef:
                  name: qmiscorecard-entra
                  key: applicationid
            # The app-registration Object ID is inventory metadata; OAuth does not use it as client_id.
            - name: ENTRA_OBJECT_ID
              valueFrom:
                secretKeyRef:
                  name: qmiscorecard-entra
                  key: objectid
            - name: ENTRA_DIRECTORY_ID
              valueFrom:
                secretKeyRef:
                  name: qmiscorecard-entra
                  key: directoryid
            - name: ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: qmiscorecard-entra
                  key: clientsecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: qmiscorecard-entra
                  key: cookiesecret
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_PROVIDER_DISPLAY_NAME
              value: EntraID
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: qmiscorecard-entra
                  key: applicationid
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: qmiscorecard-entra
                  key: clientsecret
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://login.microsoftonline.us/$(ENTRA_DIRECTORY_ID)/v2.0
            - name: OAUTH2_PROXY_USER_ID_CLAIM
              value: email
            - name: OAUTH2_PROXY_OIDC_EMAIL_CLAIM
              value: email
            - name: OAUTH2_PROXY_SCOPE
              value: openid email profile offline_access User.Read
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: S256
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://127.0.0.1:8080/
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: ngc.com
            - name: OAUTH2_PROXY_PASS_BASIC_AUTH
              value: 'false'
            - name: OAUTH2_PROXY_PASS_USER_HEADERS
              value: 'true'
            - name: OAUTH2_PROXY_PREFER_EMAIL_TO_USER
              value: 'true'
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: 'true'
            - name: OAUTH2_PROXY_COOKIE_NAME
              value: __Host-qmiscorecard
            - name: OAUTH2_PROXY_COOKIE_SECURE
              value: 'true'
            - name: OAUTH2_PROXY_COOKIE_HTTPONLY
              value: 'true'
            - name: OAUTH2_PROXY_COOKIE_SAMESITE
              value: lax
            - name: OAUTH2_PROXY_COOKIE_EXPIRE
              value: 8h
            - name: OAUTH2_PROXY_COOKIE_REFRESH
              value: 1h
            - name: OAUTH2_PROXY_RELATIVE_REDIRECT_URL
              value: 'true'
            - name: OAUTH2_PROXY_REVERSE_PROXY
              value: 'true'
            - name: OAUTH2_PROXY_FORCE_HTTPS
              value: 'true'
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: 'true'
            - name: OAUTH2_PROXY_SILENCE_PING_LOGGING
              value: 'true'
          ports:
            - name: oauth2-proxy
              containerPort: 4180
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: oauth2-proxy
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: oauth2-proxy
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
