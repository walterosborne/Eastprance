name: Apply complete month cutoff

on:
  push:
    branches:
      - entraid
    paths:
      - .github/workflows/apply-complete-month-cutoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: entraid
          fetch-depth: 0

      - name: Apply source patch
        run: node apply-complete-month-cutoff.mjs

      - name: Validate patch
        run: |
          git diff --check
          npm ci
          npm run build

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/App.jsx
          git commit -m "Stop charts at the most recent complete month"
          git push origin HEAD:entraid
