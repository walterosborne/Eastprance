providers:
  - id: qmiscorecard-entra
    provider: entra-id
    name: Microsoft Entra ID
    clientID: ${ENTRA_APPLICATION_ID}
    clientSecret: ${ENTRA_CLIENT_SECRET}
    scope: openid profile email
    code_challenge_method: S256
    skipClaimsFromProfileURL: true
    additionalClaims:
      - employeeid
      - name
      - oid
      - tid
      - aud
    microsoftEntraIDConfig:
      allowedTenants:
        - ${ENTRA_DIRECTORY_ID}
    oidcConfig:
      issuerURL: https://login.microsoftonline.com/${ENTRA_DIRECTORY_ID}/v2.0
      userIDClaim: employeeid
      emailClaim: email
      insecureSkipIssuerVerification: false
      insecureSkipNonce: false

upstreamConfig:
  upstreams:
    - id: qmiscorecard
      path: /
      uri: http://127.0.0.1:8080/
      passHostHeader: true
      proxyWebSockets: true
      timeout: 2m

# Incoming copies of these headers are stripped and replaced from the validated Entra session.
injectRequestHeaders:
  - name: X-Forwarded-EmployeeId
    values:
      - claimSource:
          claim: employeeid
  - name: X-Forwarded-User
    values:
      - claimSource:
          claim: user
  - name: X-Forwarded-Preferred-Username
    values:
      - claimSource:
          claim: preferred_username
  - name: X-Forwarded-Email
    values:
      - claimSource:
          claim: email
  - name: X-Forwarded-Name
    values:
      - claimSource:
          claim: name
  - name: X-Entra-User-Object-Id
    values:
      - claimSource:
          claim: oid
  - name: X-Entra-Tenant-Id
    values:
      - claimSource:
          claim: tid
  - name: X-Entra-Application-Id
    values:
      - claimSource:
          claim: aud
