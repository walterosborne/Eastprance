apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: qmi-scorecard-dev
  labels:
    app: oauth2-proxy

spec:
  replicas: 1

  selector:
    matchLabels:
      app: oauth2-proxy

  template:
    metadata:
      labels:
        app: oauth2-proxy
        deployment: oauth2-proxy

    spec:
      containers:
        - name: oauth2-proxy
          image: docker-ng-untrusted-group.northgrum.com/oauth2-proxy/oauth2-proxy:v7.15.2
          imagePullPolicy: IfNotPresent

          env:
            - name: ENTRA_DIRECTORY_ID
              valueFrom:
                secretKeyRef:
                  name: entra
                  key: ENTRA_DIRECTORY_ID

            - name: OAUTH2_PROXY_PROVIDER
              value: oidc

            - name: OAUTH2_PROXY_PROVIDER_DISPLAY_NAME
              value: EntraID

            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: entra
                  key: ENTRA_APPLICATION_ID

            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: entra
                  key: ENTRA_CLIENT_SECRET

            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: entra
                  key: OAUTH2_PROXY_COOKIE_SECRET

            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://login.microsoftonline.us/$(ENTRA_DIRECTORY_ID)/v2.0

            - name: OAUTH2_PROXY_REDIRECT_URL
              value: https://qmiscorecard-qmi-scorecard-dev.apps.ocpshareddev.gc1.myngc.com/oauth2/callback

            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180

            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://qmiscorecard:8080/

            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: ngc.com

            - name: OAUTH2_PROXY_SCOPE
              value: openid email profile offline_access User.Read

            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: S256

            - name: OAUTH2_PROXY_USER_ID_CLAIM
              value: email

            - name: OAUTH2_PROXY_OIDC_EMAIL_CLAIM
              value: email

            - name: OAUTH2_PROXY_PASS_BASIC_AUTH
              value: "false"

            - name: OAUTH2_PROXY_PASS_USER_HEADERS
              value: "true"

            - name: OAUTH2_PROXY_PREFER_EMAIL_TO_USER
              value: "true"

            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"

            - name: OAUTH2_PROXY_PASS_ACCESS_TOKEN
              value: "true"

            - name: OAUTH2_PROXY_REVERSE_PROXY
              value: "true"

            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"

            - name: OAUTH2_PROXY_COOKIE_NAME
              value: __Host-qmiscorecard

            - name: OAUTH2_PROXY_COOKIE_SECURE
              value: "true"

            - name: OAUTH2_PROXY_COOKIE_HTTPONLY
              value: "true"

            - name: OAUTH2_PROXY_COOKIE_SAMESITE
              value: lax

          ports:
            - name: oauth2-proxy
              containerPort: 4180
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /ready
              port: oauth2-proxy
            initialDelaySeconds: 2
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /ping
              port: oauth2-proxy
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
