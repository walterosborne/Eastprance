name: Apply Databricks comparison card

on:
  push:
    branches:
      - databricks
    paths:
      - .github/workflows/apply-databricks-comparison-card.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out databricks branch
        uses: actions/checkout@v4
        with:
          ref: databricks
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Patch comparison card and API
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          index_path = Path('server/index.js')
          index = index_path.read_text()
          index = replace_once(
              index,
              'const CONTROLLABLE_COSTS_HANA_DATASET_ENABLED = false;',
              'const CONTROLLABLE_COSTS_HANA_DATASET_ENABLED = true;',
              'enable server comparison dataset'
          )
          index = replace_once(
              index,
              "'Unable to read HANA controllable costs data.'",
              "'Unable to read Databricks controllable costs data.'",
              'Databricks API failure message'
          )
          index_path.write_text(index)

          metric_path = Path('client/src/metricInfoRaw.js')
          metric = metric_path.read_text()
          metric = replace_once(
              metric,
              "  controllableCostsHana: 'Shows total HANA costs over time by organization.',",
              "  controllableCostsHana: [\n"
              "    'Comparison view sourced from finance_dev.analytics.cost_vis_full in Databricks, filtered to CC_Bus_Unit_Lvl_2 values containing Defense Systems.',\n"
              "    'Uses signed DOC_NET_VALUE and aggregates in Databricks before the app joins dimensions.',\n"
              "    'Division and Business Unit come from the latest QMI cost-center hierarchy row; Facility comes from ecosystem_source.qmi.costcenterkey.',\n"
              "    'G/L accounts are normalized to remove leading-zero differences before matching cost_element_key, with cost_category_key as the controllability fallback.',\n"
              "    'This card is an apples-to-apples comparison source and does not replace the current Controllable Costs card.'\n"
              "  ],",
              'Databricks metric info'
          )
          metric_path.write_text(metric)

          test_path = Path('server/databricksTest.js')
          test = test_path.read_text()
          test = replace_once(
              test,
              "const TEST_QUERY = 'SELECT * FROM `databricks_dev_catalog`.`analytics`.`cost_vis_full` LIMIT 5';",
              "const TEST_QUERY = 'SELECT * FROM `finance_dev`.`analytics`.`cost_vis_full` LIMIT 5';",
              'Databricks test table'
          )
          test_path.write_text(test)

          app_path = Path('client/src/App.jsx')
          app = app_path.read_text()
          app = replace_once(
              app,
              'const CONTROLLABLE_COSTS_HANA_CARD_ENABLED = false;',
              'const CONTROLLABLE_COSTS_HANA_CARD_ENABLED = true;',
              'enable Databricks comparison card'
          )

          old_filter_block = '''const CONTROLLABLE_HANA_CHART_FILTER_FIELDS = [
            {
              value: 'sector',
              label: 'Sector',
              allLabel: 'All sectors'
            },
            {
              value: 'division',
              label: 'Division',
              allLabel: 'All divisions'
            },
            {
              value: 'business_unit',
              label: 'Business Unit',
              allLabel: 'All business units'
            },
            {
              value: 'facility',
              label: 'Facility',
              allLabel: 'All facilities'
            }
          ];'''
          app = replace_once(
              app,
              old_filter_block,
              'const CONTROLLABLE_HANA_CHART_FILTER_FIELDS = CONTROLLABLE_NEW_CHART_FILTER_FIELDS;',
              'match current cost card filter dimensions'
          )

          old_source_label = '''function getSourceLabel(source) {
            if (source === 'mssql' || source === 'dbm-sql') {
              return 'SQL Server data';
            }

            if (source === 'json') {'''
          new_source_label = '''function getSourceLabel(source) {
            if (source === 'mssql' || source === 'dbm-sql') {
              return 'SQL Server data';
            }

            if (source === 'databricks') {
              return 'Databricks data';
            }

            if (source === 'json') {'''
          app = replace_once(app, old_source_label, new_source_label, 'Databricks source label')

          text_replacements = {
              'Component unmounted before HANA controllable costs state update.': 'Component unmounted before Databricks controllable costs state update.',
              'HANA controllable costs state updated.': 'Databricks controllable costs state updated.',
              'Component unmounted after HANA controllable costs load failure.': 'Component unmounted after Databricks controllable costs load failure.',
              'Unable to load HANA controllable costs data.': 'Unable to load Databricks controllable costs data.',
              'HANA controllable costs load failed.': 'Databricks controllable costs load failed.',
              'title="Controllable Costs HANA"': 'title="Controllable Costs — Databricks"',
              'ariaLabel="HANA controllable costs overview"': 'ariaLabel="Databricks controllable costs overview"',
              'Loading HANA cost data...': 'Loading Databricks cost data...',
              'No HANA costs are available for charting.': 'No Databricks costs are available for charting.',
              'No HANA costs were found for the selected filters.': 'No Databricks costs were found for the selected filters.',
              'No HANA costs were found in the selected date range.': 'No Databricks costs were found in the selected date range.',
              'filterToggleAriaLabel="HANA costs time series"': 'filterToggleAriaLabel="Databricks costs time series"',
              'filterFieldAriaLabel="Select HANA costs filter field"': 'filterFieldAriaLabel="Select Databricks costs filter field"',
              'filterValueAriaLabel="Select HANA costs filter value"': 'filterValueAriaLabel="Select Databricks costs filter value"',
              'paletteToggleAriaLabel="HANA costs grouped palette chart"': 'paletteToggleAriaLabel="Databricks costs grouped palette chart"',
              'paletteGroupFieldAriaLabel="Select HANA costs group field"': 'paletteGroupFieldAriaLabel="Select Databricks costs group field"',
              'paletteColorFieldAriaLabel="Select HANA costs color field"': 'paletteColorFieldAriaLabel="Select Databricks costs color field"'
          }
          for old, new in text_replacements.items():
              app = replace_once(app, old, new, old)

          old_legend = '''  const controllableCostsHanaOverviewLegend = isControllableCostsHanaPalette
            ? []
            : isControllableCostsHanaPareto
              ? [
                { label: 'Total cost', color: 'var(--chart-line)' },
                paretoCumulativeLegendItem
              ]
              : [{ label: 'Total cost', color: 'var(--chart-line)' }];'''
          new_legend = '''  const controllableCostsHanaOverviewLegend = isControllableCostsHanaPalette
            ? []
            : isControllableCostsHanaPareto
              ? [
                { label: 'Total cost', color: 'var(--chart-line)' },
                paretoCumulativeLegendItem
              ]
              : [
                { label: 'Controllable', color: 'var(--chart-line)' },
                { label: 'Uncontrollable', color: 'var(--chart-accent-line)' },
                { label: 'Unclassified', color: 'var(--chart-secondary-line)' }
              ];'''
          app = replace_once(app, old_legend, new_legend, 'Databricks card legend')

          old_goal = '''  const controllableCostsHanaGoalLine = labelGoalLineValue(
            isControllableCostsHanaPareto || isControllableCostsHanaPalette
              ? null
              : getMetricGoalLine('controllableCostsHana', controllableCostsHanaViewMode),
            formatMillionsCurrencyAxis
          );'''
          new_goal = '''  const controllableCostsHanaGoalLine = labelGoalLineValue(
            isControllableCostsHanaPareto || isControllableCostsHanaPalette
              ? null
              : getFivePercentReductionFromAverageGoalLine(controllableCostsHanaChartData.total),
            formatMillionsCurrencyAxis
          );'''
          app = replace_once(app, old_goal, new_goal, 'Databricks comparison goal line')

          old_axis = '''  const visibleControllableCostsHanaGoalLine = clampGoalLineToVisibleSeries(
            controllableCostsHanaGoalLine,
            [controllableCostsHanaChartData.total]
          );
          const controllableCostsHanaChartYAxis = buildDynamicNumericYAxis(
            CONTROLLABLE_COSTS_Y_AXIS,
            [controllableCostsHanaChartData.total],
            {
              includeZero: chartVariants.controllableCostsHana === 'bar',
              goalLine: visibleControllableCostsHanaGoalLine
            }
          );'''
          new_axis = '''  const visibleControllableCostsHanaGoalLine = clampGoalLineToVisibleSeries(
            controllableCostsHanaGoalLine,
            [
              controllableCostsHanaChartData.controllable,
              controllableCostsHanaChartData.uncontrollable,
              controllableCostsHanaChartData.unclassified
            ]
          );
          const controllableCostsHanaChartYAxis = buildDynamicNumericYAxis(
            CONTROLLABLE_COSTS_Y_AXIS,
            [
              controllableCostsHanaChartData.controllable,
              controllableCostsHanaChartData.uncontrollable,
              controllableCostsHanaChartData.unclassified
            ],
            {
              includeZero: true,
              minFloor: 0,
              goalLine: visibleControllableCostsHanaGoalLine
            }
          );'''
          app = replace_once(app, old_axis, new_axis, 'Databricks card axis')

          old_series = '''                              series={[
                                {
                                  data: controllableCostsHanaChartData.total,
                                  label: 'Total Cost',
                                  color: 'var(--chart-line)',
                                  valueFormatter: formatCurrency,
                                  showMark: controllableCostsHanaChartData.labels.length <= 1
                                }
                              ]}'''
          new_series = '''                              series={[
                                {
                                  data: controllableCostsHanaChartData.controllable,
                                  label: 'Controllable',
                                  color: 'var(--chart-line)',
                                  valueFormatter: formatCurrency,
                                  showMark: controllableCostsHanaChartData.labels.length <= 1
                                },
                                {
                                  data: controllableCostsHanaChartData.uncontrollable,
                                  label: 'Uncontrollable',
                                  color: 'var(--chart-accent-line)',
                                  valueFormatter: formatCurrency,
                                  showMark: controllableCostsHanaChartData.labels.length <= 1
                                },
                                {
                                  data: controllableCostsHanaChartData.unclassified,
                                  label: 'Unclassified',
                                  color: 'var(--chart-secondary-line)',
                                  valueFormatter: formatCurrency,
                                  showMark: controllableCostsHanaChartData.labels.length <= 1
                                }
                              ]}'''
          app = replace_once(app, old_series, new_series, 'Databricks classification series')

          app_path.write_text(app)

      - name: Validate server syntax
        run: |
          node --check server/controllableCostsHanaRepository.js
          node --check server/databricksTest.js
          node --check server/index.js

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Commit implementation and remove temporary workflow
        run: |
          rm .github/workflows/apply-databricks-comparison-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js server/databricksTest.js client/src/App.jsx client/src/metricInfoRaw.js .github/workflows/apply-databricks-comparison-card.yml
          git commit -m "Show Databricks controllable costs comparison card"
          git push origin databricks
