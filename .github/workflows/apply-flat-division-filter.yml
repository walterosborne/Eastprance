name: Apply flat division filter

on:
  push:
    branches:
      - entraid
    paths:
      - .github/workflows/apply-flat-division-filter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: entraid
          fetch-depth: 0

      - name: Apply source patch
        run: node apply-flat-division-filter.mjs

      - name: Validate patch
        run: |
          git diff --check
          npm ci
          npm run build

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/App.jsx client/src/HierarchyFilters.jsx client/src/hierarchyFilter.css
          git commit -m "Use shared flat filter for divisions"
          git push origin HEAD:entraid
